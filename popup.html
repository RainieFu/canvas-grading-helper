<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canvas Grading Helper</title>
  <style>
    body { font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; width: 290px; margin: 0; padding: 18px; color: #1f2937; }
    h1 { font-size: 16px; margin: 0 0 5px; }
    p { margin: 0 0 14px; color: #5b6472; }
    button { background: #1457bb; color: white; border: 0; border-radius: 8px; padding: 11px 13px; font-size: 14px; font-weight: 650; width: 100%; cursor: pointer; }
    button:hover { background: #0e4497; }
    button:focus-visible { outline: 3px solid #e2a01a; outline-offset: 2px; }
    button:disabled { opacity: .6; cursor: default; }
    #status { min-height: 36px; margin-top: 12px; font-size: 12px; color: #475569; }
    .fineprint { font-size: 11px; margin-top: 8px; color: #657184; }
  </style>
</head>
<body>
  <h1>Canvas Grading Helper</h1>
  <p>Jump to the quiz grading save button.</p>
  <button id="scroll-btn" type="button">Scroll to Update Scores</button>
  <div id="status" role="status" aria-live="polite"></div>
  <div class="fineprint">Scroll only — does not click, submit, or change grades.</div>
  <script src="popup.js"></script>
</body>
</html>
