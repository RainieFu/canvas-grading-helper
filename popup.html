<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canvas Grading Helper</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; width: 320px; margin: 0; padding: 18px; color: #1f2937; }
    h1 { font-size: 17px; margin: 0 0 5px; }
    p { margin: 0 0 14px; color: #566172; }
    button { width: 100%; padding: 11px 13px; margin: 0 0 9px; font-size: 14px; font-weight: 650; border-radius: 8px; border: 1px solid transparent; cursor: pointer; background: #1b58b7; color: white; }
    button.secondary { background: #f6f8fb; color: #183969; border-color: #cbd5e1; }
    button.neutral { background: transparent; color: #4b5563; border-color: #cbd5e1; font-size: 12px; padding: 8px; }
    button:hover:not(:disabled) { filter: brightness(.95); }
    button:focus-visible { outline: 3px solid #e2a01a; outline-offset: 2px; }
    button:disabled { opacity: .55; cursor: default; }
    #status { min-height: 42px; font-size: 12px; margin: 6px 0 0; padding: 9px 10px; background: #f1f5f9; border-radius: 7px; color: #364152; overflow-wrap: anywhere; }
    #detail { white-space: pre-wrap; overflow-wrap: anywhere; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; color: #374151; }
    .fineprint { font-size: 11px; margin: 9px 0 0; color: #5e6878; }
  </style>
</head>
<body>
  <h1>Canvas Grading Helper <small style="font-size:11px;font-weight:400">v0.2</small></h1>
  <p>For UBC Canvas SpeedGrader quiz submissions</p>
  <button id="scroll-btn" type="button" class="secondary">Scroll to Update Scores</button>
  <button id="save-btn" type="button">Save Scores (test)</button>
  <button id="inspect-btn" type="button" class="neutral">Inspect buttons (no changes)</button>
  <div id="status" role="status" aria-live="polite">Ready.</div>
  <div id="detail"></div>
  <p class="fineprint">Save triggers Canvas's actual Update Scores button. It does not verify success yet or move to the next student. Test on an already graded submission and confirm Canvas saved before navigating.</p>
  <script src="popup.js"></script>
</body>
</html>
